
name: Test GitHub Actions

on:
  push:
    branches:
      - main
    paths:
      - '01-simple-blog/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run index.js
        working-directory: 01-simple-blog
        run: node index.js